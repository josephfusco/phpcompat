name: Dependabot auto-merge

# Enables auto-merge on Dependabot PRs that only touch development dependencies
# at the patch or minor level. GitHub then merges them once required checks
# (the CI workflow) pass. Anything else — runtime dependencies, major bumps,
# GitHub Actions updates — waits for a human.
#
# Requires: "Allow auto-merge" enabled in repo settings, and branch protection
# on main with the CI jobs marked as required status checks.

on: pull_request_target

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.repository == 'wpengine/phpcompat'
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@v2

      - name: Enable auto-merge for dev-only patch/minor updates
        if: >-
          steps.meta.outputs.dependency-type == 'direct:development' &&
          (steps.meta.outputs.update-type == 'version-update:semver-patch' ||
           steps.meta.outputs.update-type == 'version-update:semver-minor')
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
