name: Tide watch

# Daily check on the wptide.org API the plugin depends on. Opens (or comments
# on) an issue when:
#   - Tide is unreachable or returns an unexpected response, or
#   - Tide starts reporting PHP versions newer than 8.0 — the plugin's results
#     and readme should then be updated to match.

on:
  schedule:
    - cron: '41 9 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  watch:
    if: github.repository == 'wpengine/phpcompat'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Newest PHP version Tide reported when the plugin last changed.
      KNOWN_MAX_PHP: '8.0'
      PROBE_SLUG: akismet
    steps:
      - name: Query Tide
        id: probe
        run: |
          set -u
          version=$(curl -fsS "https://api.wordpress.org/plugins/info/1.2/?action=plugin_information&request%5Bslug%5D=${PROBE_SLUG}" | jq -r '.version')
          url="https://wptide.org/api/v1/audit/wporg/plugin/${PROBE_SLUG}/${version}?reports=phpcs_phpcompatibilitywp"
          code=$(curl -sS -m 60 -o tide.json -w '%{http_code}' "$url" || echo 000)
          echo "url=$url" >> "$GITHUB_OUTPUT"

          if [ "$code" != "200" ] || ! jq -e . tide.json >/dev/null 2>&1; then
            echo "problem=down" >> "$GITHUB_OUTPUT"
            echo "detail=HTTP $code from $url" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          status=$(jq -r '.status' tide.json)
          if [ "$status" != "complete" ]; then
            # New releases can take a while to audit; not an outage on its own.
            echo "Audit status is '$status'; skipping version check."
            exit 0
          fi

          max=$(jq -r '.reports.phpcs_phpcompatibilitywp.report | (.compatible + .incompatible) | map(select(test("^[0-9]+\\.[0-9]+$"))) | sort_by(split(".") | map(tonumber)) | last // empty' tide.json)
          phpcompat=$(jq -r '.reports.phpcs_phpcompatibilitywp.server.dependencies[]? | select(.vendor == "phpcompatibility/phpcompatibility-wp") | .version' tide.json)
          echo "Tide max PHP: ${max:-none}; PHPCompatibilityWP: ${phpcompat:-unknown}"

          if [ -z "$max" ]; then
            echo "problem=format" >> "$GITHUB_OUTPUT"
            echo "detail=Report from $url has no PHP versions; the response format may have changed." >> "$GITHUB_OUTPUT"
          elif [ "$(printf '%s\n%s\n' "$max" "$KNOWN_MAX_PHP" | sort -V | tail -1)" != "$KNOWN_MAX_PHP" ]; then
            echo "problem=newphp" >> "$GITHUB_OUTPUT"
            echo "detail=Tide now reports up to PHP $max (PHPCompatibilityWP $phpcompat). Update the plugin's results display and readme, then bump KNOWN_MAX_PHP in this workflow." >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update issue
        if: steps.probe.outputs.problem != ''
        env:
          PROBLEM: ${{ steps.probe.outputs.problem }}
          DETAIL: ${{ steps.probe.outputs.detail }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          case "$PROBLEM" in
            down)   title="Tide API check failing" ;;
            format) title="Tide API response format changed" ;;
            newphp) title="Tide now reports newer PHP versions" ;;
          esac
          body=$(printf '%s\n\nWorkflow run: %s' "$DETAIL" "$RUN_URL")
          existing=$(gh issue list -R "$REPO" --state open --search "in:title \"$title\"" --json number -q '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" -R "$REPO" --body "$body"
          else
            gh issue create -R "$REPO" --title "$title" --body "$body"
          fi
