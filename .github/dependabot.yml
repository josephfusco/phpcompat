version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      # The PHP runtime the browser scans with. It ships in plugin/build, both
      # packages must stay on the same version, and Scanner_Bundle::WASM_VERSION
      # has to change with them (tests/WasmVersionTest.php fails until it does).
      # Listed first so these never land in the auto-merged group below.
      php-wasm:
        patterns: ["@php-wasm/*"]
      # Build and test tooling only; nothing here ships in plugin/.
      npm-dev-minor-patch:
        dependency-type: development
        update-types: [minor, patch]

  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      composer-dev-minor-patch:
        dependency-type: development
        update-types: [minor, patch]

  # The scanner that ships in the plugin (phpcs + PHPCompatibilityWP). Each
  # update changes the rule set, so stored results are rescanned with it.
  - package-ecosystem: composer
    directory: /tools/phpcs-bundle
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
