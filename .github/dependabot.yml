version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      # Build and test tooling only; nothing here ships in plugin/.
      npm-dev-minor-patch:
        dependency-type: development
        update-types: [minor, patch]

  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      composer-dev-minor-patch:
        dependency-type: development
        update-types: [minor, patch]

  # The scanner that ships in the plugin (phpcs + PHPCompatibilityWP). Each
  # update changes the rule set, so stored results are rescanned with it.
  - package-ecosystem: composer
    directory: /tools/phpcs-bundle
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
